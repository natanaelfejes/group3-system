# Per client IP, for /api/ only.
limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;

server {
    listen 80;
    server_tokens off;
    root /usr/share/nginx/html;

    # No sniffing content types, and no other site can put the app in an iframe.
    add_header X-Content-Type-Options nosniff always;
    add_header Content-Security-Policy "frame-ancestors 'none'" always;

    # Same origin as the app, like the Vite dev proxy in vite.config.ts. No CORS needed.
    # The variable and the resolver let nginx start while api is down and find it again when it comes back.
    location /api/ {
        # 429, so the Pico can tell "too fast" apart from the backend's 503 "simulator down".
        limit_req zone=api burst=20 nodelay;
        limit_req_status 429;
        resolver 127.0.0.11 valid=10s;
        set $api http://api:3000;
        proxy_pass $api;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # A missing hashed asset is a real 404, not index.html.
    location /assets/ {
        try_files $uri =404;
    }

    # Single-page app: unknown paths get index.html.
    location / {
        try_files $uri /index.html;
    }
}
