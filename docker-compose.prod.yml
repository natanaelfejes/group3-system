# Production override for the Azure VM. Use it on top of docker-compose.yml:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --no-build
# The VM only has 1 GB RAM, so the images are built on a laptop (linux/amd64) and loaded with docker load.
services:
  simulator:
    image: group3-simulator:prod
  web:
    image: group3-web:prod
    # Public on port 80. The simulator stays private (no published port in the base file beyond localhost).
    ports: !override
      - "80:80"
