# Run with: docker compose up --build
services:
  simulator:
    build: ./simulator
    environment:
      SIMULATOR_API_KEY: ${SIMULATOR_API_KEY:?copy .env.example to .env and set a key}
    # Localhost only: the key is in the URL path, so the simulator must never be public.
    # Other services in this compose file reach it as http://simulator:8000.
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - sim-data:/app/data
    # The simulator saves desk state on Ctrl+C only, so stop it with SIGINT.
    # It needs ~5 s to stop its threads before saving; without the grace period it gets killed first.
    stop_signal: SIGINT
    stop_grace_period: 30s
    restart: unless-stopped
    # The simulator logs every request URL, key included. Keep the logs small.
    logging:
      options:
        max-size: "1m"
        max-file: "2"
    healthcheck:
      test: ["CMD", "python", "-c", "import os,urllib.request as u; u.urlopen('http://localhost:8000/api/v2/%s/desks' % os.environ['SIMULATOR_API_KEY'])"]
      interval: 15s
      timeout: 5s
      retries: 3

  api:
    build: ./backend
    environment:
      # 0.0.0.0 so nginx in the web container can reach it (the default is localhost only).
      HOST: 0.0.0.0
      PORT: 3000
      SIMULATOR_URL: http://simulator:8000
      SIMULATOR_API_KEY: ${SIMULATOR_API_KEY:?copy .env.example to .env and set a key}
    # Localhost only, also on the VM (prod does not change this). The Pico gets in through web on port 80.
    # There is no auth yet, so never publish this on all interfaces.
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - simulator
    restart: unless-stopped
    logging:
      options:
        max-size: "1m"
        max-file: "2"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3

  web:
    build: ./web
    # nginx proxies /api/ to the api service.
    depends_on:
      - api
    # 3000 is the backend's port, so the frontend uses 8081.
    ports:
      - "127.0.0.1:8081:80"
    restart: unless-stopped
    logging:
      options:
        max-size: "1m"
        max-file: "2"

volumes:
  sim-data:
